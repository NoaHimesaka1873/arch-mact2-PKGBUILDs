name: Build Packages

on:
  push:
    branches:
      - senpai
  pull_request:
    branches:
      - senpai
  workflow_dispatch:

jobs:
  get_changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_max_depth: 1

      - name: Set matrix
        id: set-matrix
        run: |
          PACKAGES="[]"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            for dir in */ ; do
              if [ -f "$dir/PKGBUILD" ]; then
                d="${dir%/}"
                PACKAGES=$(echo "$PACKAGES" | jq -c --arg d "$d" '. += [$d]')
              fi
            done
          else
            for dir in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if [ -d "$dir" ] && [ -f "$dir/PKGBUILD" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c --arg d "$dir" '. += [$d]')
              fi
            done
          fi
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  build:
    needs: get_changes
    if: ${{ needs.get_changes.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.get_changes.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pacman keys and update
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git sudo

      - name: Setup build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
          chown -R builduser:builduser .

      - name: Add arch-mact2 repository
        run: |
          cat <<EOF | tee -a /etc/pacman.conf
          [arch-mact2]
          Server = https://mirror.funami.tech/arch-mact2/os/x86_64
          SigLevel = Never
          EOF
          pacman -Sy

      - name: Build package
        run: |
          cd ${{ matrix.package }}
          sudo -u builduser makepkg -s --noconfirm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-pkg
          path: ${{ matrix.package }}/*.pkg.tar.zst

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/senpai' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Rolling Release"
          artifacts: "artifacts/*.pkg.tar.zst"
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci 
          version: latest

      - name: Upload and Update Repo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          # Upload Packages
          cd artifacts
          PKG_FILES=$(echo *.pkg.tar.zst)
          scp -i ~/.ssh/id_ed25519 $PKG_FILES $SSH_USER@$SSH_HOST:$REMOTE_DIR/

          # Update Repository
          ssh -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "cd $REMOTE_DIR && repo-add $REPO_NAME.db.tar.zst $PKG_FILES"

permissions:
  id-token: write # This is required for the tailscale action to request a JWT from GitHub
  contents: write
