name: Build Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  get_changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_max_depth: 1

      - name: Set matrix
        id: set-matrix
        run: |
          PACKAGES="[]"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            for dir in */ ; do
              if [ -f "$dir/PKGBUILD" ]; then
                d="${dir%/}"
                PACKAGES=$(echo "$PACKAGES" | jq -c --arg d "$d" '. += [$d]')
              fi
            done
          else
            for dir in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if [ -d "$dir" ] && [ -f "$dir/PKGBUILD" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c --arg d "$dir" '. += [$d]')
              fi
            done
          fi
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

  build:
    needs: get_changes
    if: ${{ needs.get_changes.outputs.packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.get_changes.outputs.packages) }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pacman keys and update
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git sudo

      - name: Setup build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
          chown -R builduser:builduser .

      - name: Build package
        run: |
          cd ${{ matrix.package }}
          sudo -u builduser makepkg -s --noconfirm

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-pkg
          path: ${{ matrix.package }}/*.pkg.tar.zst

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Rolling Release"
          artifacts: "artifacts/*.pkg.tar.zst"
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
