name: Update tiny-dfr

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new git release
        id: check
        run: |
          CURRENT_PKGVER=$(grep '^pkgver=' tiny-dfr-arch/PKGBUILD | cut -d= -f2 | tr -d "'" | tr -d '"')
          
          # Clone the upstream repository to get the latest git version
          git clone https://github.com/AsahiLinux/tiny-dfr /tmp/tiny-dfr
          cd /tmp/tiny-dfr
          NEW_PKGVER=$(git describe --long --tags --abbrev=7 | sed 's/\([^-]*-g\)/r\1/;s/-/./g')
          cd - > /dev/null
          
          echo "Current: $CURRENT_PKGVER"
          echo "New: $NEW_PKGVER"
          
          if [ -z "$NEW_PKGVER" ]; then
            echo "Failed to determine new pkgver"
            exit 1
          fi

          if [ "$CURRENT_PKGVER" != "$NEW_PKGVER" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_PKGVER" >> "$GITHUB_OUTPUT"
            
            sed -i "s/^pkgver=.*/pkgver=$NEW_PKGVER/" tiny-dfr-arch/PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" tiny-dfr-arch/PKGBUILD
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update tiny-dfr to ${{ steps.check.outputs.version }}"
          title: "Update tiny-dfr to ${{ steps.check.outputs.version }}"
          body: |
            Automatically generated pull request.
            Updates tiny-dfr to git version ${{ steps.check.outputs.version }}
          branch: "update-tiny-dfr-${{ steps.check.outputs.version }}"
